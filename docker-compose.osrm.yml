services:
  osrm-north:
    image: osrm/osrm-backend:latest
    container_name: trek_osrm_north
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld -t 1 /data/northern-zone-latest.osrm

  osrm-west:
    image: osrm/osrm-backend:latest
    container_name: trek_osrm_west
    restart: unless-stopped
    ports:
      - "5002:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld -t 1 /data/western-zone-latest.osrm

  osrm-east:
    image: osrm/osrm-backend:latest
    container_name: trek_osrm_east
    restart: unless-stopped
    ports:
      - "5003:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld -t 1 /data/eastern-zone-latest.osrm

  osrm-central:
    image: osrm/osrm-backend:latest
